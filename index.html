<script>
const screens=[...document.querySelectorAll('.screen')],intro=document.getElementById('intro'),flash=document.getElementById('flash'),jump=document.getElementById('jump'),flyer=document.getElementById('flyer'),pics=[...document.querySelectorAll('.flashImg')];
let ctx,master,storm,rumble;
const activeSounds=new Set();
const soundFiles=Promise.all(['thunder','scream','spooky-music','evil-laugh'].map(async name=>{const response=await fetch('assets/'+name+(name==='spooky-music'?'.ogg':'.mp3'));if(!response.ok)throw new Error('Geluid laden mislukt');return [name,await response.arrayBuffer()]}));
let decoded;
const rain=document.getElementById('rain-audio');rain.volume=.4;
const distantThunder=new Audio('assets/thunder.mp3');distantThunder.volume=.18;distantThunder.preload='auto';
let ambienceTimer,ambienceStarted=false,entering=false;
async function startAmbience(){
 if(entering||ambienceStarted||!intro.classList.contains('active'))return;
 try{await rain.play();if(entering){rain.pause();return}ambienceStarted=true;distantThunder.currentTime=3;distantThunder.play().catch(()=>{});ambienceTimer=setInterval(()=>{if(!entering){distantThunder.currentTime=0;distantThunder.play().catch(()=>{})}},18000)}catch(e){/* The browser may require a user gesture before audible playback. */}
}
function stopAmbience(){clearInterval(ambienceTimer);rain.pause();distantThunder.pause();ambienceStarted=false}
startAmbience();
document.addEventListener('pointerdown',event=>{if(!event.target.closest('#start'))startAmbience()});
document.addEventListener('keydown',()=>startAmbience());
window.addEventListener('pagehide',()=>{stopAmbience();stopSounds()});

function show(el){screens.forEach(s=>s.classList.remove('active'));el.classList.add('active')}
function ac(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createDynamicsCompressor();master.threshold.value=-8;master.knee.value=6;master.ratio.value=8;master.connect(ctx.destination);storm=ctx.createGain();storm.connect(master)}if(ctx.state==='suspended')ctx.resume();return ctx}
async function loadSounds(){ac();if(!decoded)decoded= soundFiles.then(files=>Promise.all(files.map(async([name,bytes])=>[name,await ctx.decodeAudioData(bytes.slice(0))]))).then(entries=>Object.fromEntries(entries));return decoded}
function playSample(buffer,{offset=0,duration=buffer.duration-offset,volume=1,rate=1,bus=master,lowpass=0}={}){const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=buffer;source.playbackRate.value=rate;gain.gain.value=volume;source.connect(gain);if(lowpass){const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=lowpass;gain.connect(filter);filter.connect(bus)}else gain.connect(bus);source.start(ctx.currentTime,offset,duration);activeSounds.add(source);source.onended=()=>activeSounds.delete(source);return source}
async function startRumble(){const sounds=await loadSounds();storm.gain.setValueAtTime(1,ctx.currentTime);rumble=playSample(sounds.thunder,{offset:5,duration:16,volume:1.5,lowpass:420,bus:storm})}
async function thunder(){const sounds=await loadSounds();playSample(sounds.thunder,{offset:.48,duration:4.5,volume:1.5,rate:.96+Math.random()*.08,bus:storm})}
async function scream(){
 const sounds=await loadSounds(),now=ctx.currentTime;
 // Use the strongest isolated scream, with a short room echo.
 const voice=ctx.createBufferSource(),voiceGain=ctx.createGain(),echo=ctx.createDelay(.3),echoGain=ctx.createGain();
 voice.buffer=sounds.scream;voice.playbackRate.value=1.08;
 voiceGain.gain.setValueAtTime(0,now);voiceGain.gain.linearRampToValueAtTime(1.8,now+.012);voiceGain.gain.setValueAtTime(1.8,now+.75);voiceGain.gain.linearRampToValueAtTime(0,now+1.05);
 voice.connect(voiceGain);voiceGain.connect(master);echo.delayTime.value=.13;echoGain.gain.value=.2;voiceGain.connect(echo);echo.connect(echoGain);echoGain.connect(master);
 voice.start(now,5.72,1.15);activeSounds.add(voice);voice.onended=()=>activeSounds.delete(voice);
 // A deep impact reinforces the scream without adding a high-pitched beep.
 const impact=ctx.createOscillator(),impactGain=ctx.createGain();impact.type='sine';impact.frequency.setValueAtTime(95,now);impact.frequency.exponentialRampToValueAtTime(32,now+.24);
 impactGain.gain.setValueAtTime(.001,now);impactGain.gain.exponentialRampToValueAtTime(.65,now+.008);impactGain.gain.exponentialRampToValueAtTime(.001,now+.32);impact.connect(impactGain);impactGain.connect(master);impact.start(now);impact.stop(now+.34);activeSounds.add(impact);impact.onended=()=>activeSounds.delete(impact);
}
async function evilLaugh(){
 const sounds=await loadSounds();
 const source=playSample(sounds['evil-laugh'],{volume:1.45,rate:.94});
 await new Promise(resolve=>{source.onended=()=>{activeSounds.delete(source);resolve()}});
}
async function startFlyerMusic(){
 const sounds=await loadSounds();if(!flyer.classList.contains('active'))return;
 const source=ctx.createBufferSource(),gain=ctx.createGain();source.buffer=sounds['spooky-music'];source.loop=true;
 gain.gain.setValueAtTime(0,ctx.currentTime);gain.gain.linearRampToValueAtTime(.5,ctx.currentTime+1.8);
 source.connect(gain);gain.connect(master);source.start();activeSounds.add(source);source.onended=()=>activeSounds.delete(source);
}
function quietStorm(){storm.gain.cancelScheduledValues(ctx.currentTime);storm.gain.setTargetAtTime(0,ctx.currentTime,.04)}
function stopSounds(){for(const source of activeSounds)try{source.stop()}catch(e){}activeSounds.clear()}
function strike(){const bolt=document.getElementById('lightning');bolt.classList.remove('strike');void bolt.offsetWidth;bolt.classList.add('strike');thunder()}
const flashMessages=[
