<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050000">
<title>Halloween Feest 2026</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button{font:inherit}.screen{position:fixed;inset:0}.bg{position:absolute;inset:0;background:url('https://raw.githubusercontent.com/diapas39-sketch/Helloween-feest/main/intro.jpg') center/cover no-repeat;filter:saturate(1.05) contrast(1.08)}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.25) 45%,rgba(0,0,0,.8))}.red{position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,0,0,.28),transparent 30%),radial-gradient(circle at 80% 35%,rgba(180,0,0,.22),transparent 24%);mix-blend-mode:screen;animation:flicker 1.8s steps(8,end) infinite}.fog{position:absolute;left:-25%;width:150%;height:30%;bottom:-5%;background:radial-gradient(ellipse at center,rgba(255,255,255,.18),rgba(255,255,255,.05) 38%,transparent 72%);filter:blur(24px);animation:fogmove 14s linear infinite}.fog.f2{bottom:24%;opacity:.6;animation-duration:20s;animation-direction:reverse}@keyframes flicker{0%,100%{opacity:.2}14%{opacity:.42}19%{opacity:.08}35%{opacity:.32}39%{opacity:.12}61%{opacity:.4}65%{opacity:.1}82%{opacity:.3}}@keyframes fogmove{from{transform:translateX(-9%)}to{transform:translateX(9%)}}#intro{z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0 20px 42px}.content{position:relative;z-index:3;text-align:center;width:min(620px,100%);text-shadow:0 3px 12px #000}.title{font-size:clamp(36px,10vw,64px);line-height:.92;font-weight:1000;color:#ff2a1f;letter-spacing:-.03em;text-transform:uppercase}.sub{font-size:clamp(22px,5vw,32px);font-weight:900;margin:6px 0 16px}.sound{font-size:20px;font-weight:900;margin:0 0 18px}.cta{width:100%;border:2px solid #ff3b32;background:linear-gradient(#8f0909,#3e0000);color:#fff;border-radius:16px;padding:17px 20px;font-size:20px;font-weight:1000;box-shadow:0 0 24px rgba(255,0,0,.4),inset 0 0 18px rgba(255,80,60,.18)}#jump{z-index:100;display:none;background:#000;align-items:center;justify-content:center;overflow:hidden}#jump.show{display:flex}.jumpimg{position:absolute;inset:-4%;background:url('https://raw.githubusercontent.com/diapas39-sketch/Helloween-feest/main/jump.jpg') center/cover no-repeat;animation:attack 1.05s cubic-bezier(.1,.9,.15,1) forwards}.flash{position:absolute;inset:0;background:#fff;mix-blend-mode:screen;animation:flash .7s linear forwards;pointer-events:none}@keyframes attack{0%{transform:scale(.45);filter:blur(8px)}45%{transform:scale(1.22);filter:blur(1px)}100%{transform:scale(1.08);filter:blur(0)}}@keyframes flash{0%{opacity:1}8%{opacity:0}19%{opacity:.9}28%{opacity:0}47%{opacity:.6}58%,100%{opacity:0}}#flyer{z-index:50;display:none;background:#050000;overflow:auto;padding:14px 14px 26px}#flyer.show{display:block}.flyer-wrap{width:min(720px,100%);margin:0 auto;position:relative}.flyer-img{width:100%;display:block;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.7)}.wa{display:block;margin:14px 0 0;text-decoration:none;text-align:center;color:#fff;font-weight:1000;font-size:18px;padding:17px 18px;border-radius:16px;background:#148c38;box-shadow:0 10px 28px rgba(0,0,0,.35)}.wa.disabled{background:#3b3b3b;pointer-events:none;opacity:.85}.note{text-align:center;color:#cfcfcf;font-size:13px;margin:8px 0 0}@media(max-width:480px){#intro{padding-bottom:28px}.title{font-size:42px}.sub{font-size:24px}.sound{font-size:18px}.cta{font-size:18px}.flyer-img{border-radius:12px}}
</style>
</head>
<body>
<section id="intro" class="screen"><div class="bg"></div><div class="shade"></div><div class="red"></div><div class="fog"></div><div class="fog f2"></div><div class="content"><div class="title">Uitnodiging</div><div class="sub">voor de schrik van je leven</div><div class="sound">🔊 Zet je geluid aan</div><button id="start" class="cta">IK BEN ER KLAAR VOOR</button></div></section>
<section id="jump" class="screen"><div class="jumpimg"></div><div class="flash"></div></section>
<section id="flyer" class="screen"><div class="flyer-wrap"><img class="flyer-img" src="https://raw.githubusercontent.com/diapas39-sketch/Helloween-feest/main/flyer.jpg" alt="Halloween Feest flyer"><a class="wa disabled" id="wa" href="#">💬 GA NAAR WHATSAPP-GROEP</a><div class="note">De WhatsApp-link koppelen we later.</div></div></section>
<script>
let ctx;
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function scream(){const c=audio(),now=c.currentTime,master=c.createGain();master.gain.value=.9;master.connect(c.destination);const len=Math.floor(c.sampleRate*1.0),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/c.sampleRate;const env=Math.exp(-2.6*t);data[i]=(Math.random()*2-1)*env*(.85+.15*Math.sin(2*Math.PI*33*t));}const src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();src.buffer=buf;bp.type='bandpass';bp.frequency.value=1700;bp.Q.value=.7;g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.8,now+.02);g.gain.exponentialRampToValueAtTime(.05,now+.9);src.connect(bp);bp.connect(g);g.connect(master);src.start(now);src.stop(now+1);const o=c.createOscillator(),og=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(900,now);o.frequency.exponentialRampToValueAtTime(280,now+.8);og.gain.setValueAtTime(.001,now);og.gain.exponentialRampToValueAtTime(.22,now+.02);og.gain.exponentialRampToValueAtTime(.001,now+.85);o.connect(og);og.connect(master);o.start(now);o.stop(now+.9)}
const intro=document.getElementById('intro'),jump=document.getElementById('jump'),flyer=document.getElementById('flyer');
document.getElementById('start').addEventListener('click',()=>{audio();intro.style.display='none';jump.classList.add('show');scream();setTimeout(()=>{jump.classList.remove('show');flyer.classList.add('show')},2000)});
</script>
</body>
</html>
